name: Sync Major Tag

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      tag:
        description: "Version tag (vX.Y.Z) whose major version tag should be moved"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Move major tag
        shell: bash
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "\"$TAG\" is not a version tag (vX.Y.Z). Skipping major tag move."
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git rev-parse --verify "refs/tags/$TAG"
          echo "Moving major tag $MAJOR -> $TAG"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
          echo "Done: $MAJOR now points to $TAG"
