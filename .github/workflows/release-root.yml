name: Release Root

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bump level"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Release
        run: node scripts/release.mjs "${{ inputs.version }}" --ci
        env:
          GH_TOKEN: ${{ github.token }}
